name: Deploy Documentation

on:
  push:
    branches: [main, master, docs/add-sphinx-documentation]
    paths:
      - 'fuel_cell_3D/docs/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install sphinx
          pip install numpy scipy tifffile  # Required for autodoc
      
      - name: Build documentation
        run: |
          cd fuel_cell_3D/docs
          make html
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: fuel_cell_3D/docs/_build/html

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
